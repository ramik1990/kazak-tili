name: uchebnik

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
    volumes:
      - ./.env:/var/www/html/.env
      - storage:/var/www/html/storage
      - public_build:/var/www/html/public/build
    depends_on:
      - db

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - public_build:/var/www/html/public/build:ro
      - storage:/var/www/html/storage:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-uchebnik}
      MYSQL_USER: ${DB_USERNAME:-uchebnik}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=96M
    volumes:
      - mysql:/var/lib/mysql

volumes:
  mysql:
  storage:
  public_build:
